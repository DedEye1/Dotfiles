[audio]
enable_sounds = true

[backdrop]
enabled = true

[bar]
order = [ "default", "Workspaces" ]

    [bar.Workspaces]
    background_opacity = 0.79999998211860657
    center = [ "workspaces" ]
    enabled = true
    end = []
    font_family = "Noto Serif"
    margin_ends = 400
    position = "right"
    reserve_space = false
    smart_auto_hide = true
    start = []
    thickness = 28

    [bar.default]
    background_opacity = 0.79999998211860657
    center = [ "date", "spacer_2", "clock", "spacer_2", "weather" ]
    contact_shadow = true
    end = [
        "keyboard_layout",
        "clipboard",
        "spacer_2",
        "bluetooth",
        "volume",
        "brightness",
        "network",
        "spacer_2",
        "notifications",
        "battery"
    ]
    font_family = "Noto Serif"
    start = [ "session", "control-center", "spacer_2", "tray", "spacer_2", "media", "audio_visualizer" ]

[battery]
warning_threshold = 20

[desktop_widgets]
schema_version = 2
widget_order = [
    "desktop-widget-0000000000000003",
    "desktop-widget-0000000000000004",
    "desktop-widget-0000000000000005",
    "desktop-widget-0000000000000006",
    "desktop-widget-0000000000000007",
    "desktop-widget-0000000000000008"
]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 240.0
    box_width = 480.0
    cx = 1616.0
    cy = 868.0
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        shadow = false

    [desktop_widgets.widget.desktop-widget-0000000000000004]
    box_height = 0.0
    box_width = 0.0
    cx = 218.0
    cy = 866.0
    output = "eDP-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000004.settings]
        background = false
        sensitivity = 1.0
        visualization_mode = "all"

    [desktop_widgets.widget.desktop-widget-0000000000000005]
    box_height = 144.0
    box_width = 320.0
    cx = 224.0
    cy = 164.0
    output = "eDP-1"
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000005.settings]
        display = "gauge"
        gauge_layout = "horizontal"
        stat = "cpu_usage"
        stat2 = "gpu_usage"

    [desktop_widgets.widget.desktop-widget-0000000000000006]
    box_height = 144.0
    box_width = 336.0
    cx = 1768.0
    cy = 164.0
    output = "eDP-1"
    rotation = -0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000006.settings]
        background = false
        shadow = false

    [desktop_widgets.widget.desktop-widget-0000000000000007]
    box_height = 192.0
    box_width = 320.0
    cx = 1432.0
    cy = 164.0
    output = "eDP-1"
    rotation = -0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000007.settings]
        background = false
        background_opacity = 0.0
        center_text = true
        clock_style = "digital"
        format = "{:%H:%M}"
        shadow = false

    [desktop_widgets.widget.desktop-widget-0000000000000008]
    box_height = 144.0
    box_width = 320.0
    cx = 224.0
    cy = 356.0
    output = "eDP-1"
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000008.settings]
        display = "gauge"
        gauge_layout = "horizontal"
        stat = "gpu_usage"
        stat2 = "gpu_usage"

[dock]
background_opacity = 0.79999998211860657
cross_axis_padding = 4
enabled = true
icon_size = 40
main_axis_padding = 4
margin_edge = 5
pinned = [ "zen", "happ", "kitty", "code", "org.telegram.desktop", "org.gnome.Nautilus" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@winit", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 878.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 702.0
    cy = 1339.0
    output = "winit"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.79999998211860657

[osd]
background_opacity = 0.79999998211860657
orientation = "vertical"
position_vertical = "center_left"

[plugins]
enabled = [ "noctalia/kaomoji", "tadomika_ari/w-engine", "yocraft/web-launcher" ]

[shell]
app_icon_color = "primary"
clipboard_confirm_clear_history = false
font_family = "Noto Serif"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
telemetry_enabled = true

    [shell.launcher.providers.calculator]
    global = false

    [shell.launcher.providers.emoji]
    global = false
    prefix = ""

    [shell.panel]
    open_near_click_control_center = true

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]

[wallpaper]
transition = [ "fade", "honeycomb" ]
